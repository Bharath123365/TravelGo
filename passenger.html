
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGo - Passenger Details</title>
    <link rel="stylesheet" href="css/booking.css">
</head>
<body class="passenger-page">

    <header class="passenger-header">
        <h2>TravelGo<span>.</span></h2>
        <a href="index.html">← Back to Home</a>
    </header>

    <main class="container">

        <div class="passenger-heading">
            <p class="eyebrow">ALMOST THERE!</p>
            <h1>Passenger Details</h1>
            <p>Please enter the passenger information to complete your booking.</p>
        </div>

        <div class="bus-info">
            <h3 id="bus-name">Bus Details</h3>
            <p id="journey"></p>
            <p id="seats"></p>
            <p id="amount"></p>
        </div>

        <form id="passenger-form" class="booking-summary">

            <div class="form-heading">
                <h3>Passenger Information</h3>
                <p>Fields marked below are required.</p>
            </div>

            <label for="name">Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name" required>

            <label for="age">Age</label>
            <input type="number" id="age" min="1" max="100"
                   placeholder="Enter your age" required>

            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" maxlength="10"
                   pattern="[6-9][0-9]{9}"
                   placeholder="Enter 10-digit mobile number" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <button type="submit">
                Continue to Confirmation →
            </button>

            <p class="form-note">
                Please check your details before continuing.
            </p>

        </form>

    </main>

    <script src="js/passenger.js"></script>
</body>
</html>
